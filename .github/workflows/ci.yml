name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.24.x
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "${files}" || {
            printf 'files need gofmt:\n%s\n' "${files}" >&2
            exit 1
          }
      - name: Test
        run: go test -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Race test
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint
        run: golangci-lint run ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - name: Scan dependencies
        run: govulncheck ./...
