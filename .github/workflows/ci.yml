name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.24.x
      - name: Check module files
        run: go mod tidy -diff
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          test -z "${files}" || {
            printf 'files need gofmt:\n%s\n' "${files}" >&2
            exit 1
          }
      - name: Test
        run: go test -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Race test
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
      - name: Lint
        run: golangci-lint run ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Scan dependencies
        run: govulncheck ./...
